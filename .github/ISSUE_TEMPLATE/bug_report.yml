name: Bug report
description: A skill, agent, installer or template does the wrong thing
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran or asked, what Claude or the script did, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. /ship-workflow:feature add X
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versions
      description: Output of `claude --version`, plus the plugin version shown by `/plugin`.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install method
      options: [Plugin marketplace, install.sh, init-repo.sh (copied into a repo)]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output or transcript excerpt
      render: text
