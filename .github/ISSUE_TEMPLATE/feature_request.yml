name: Feature request
description: A new skill, agent, gate or template
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What goes wrong or takes too long today when you work with Claude?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should the plugin do? If it is a new gate or rule, say how you would test that Claude follows it.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Optional. A public PR, repo or doc that shows teams working this way.
