# Push a tag like v1.2.0 to release. The job refuses a tag that does not match the plugin and
# marketplace versions, runs the full test suite, and publishes the CHANGELOG section as notes.
name: Release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for v in "$(jq -r .version plugins/ship-workflow/.claude-plugin/plugin.json)" \
                   "$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)" \
                   "$(jq -r .metadata.version .claude-plugin/marketplace.json)"; do
            [ "$v" = "$tag" ] || { echo "::error::version $v does not match tag $tag"; exit 1; }
          done
      - run: pip install pyyaml
      - run: bash tests/run.sh
      - name: Notes from CHANGELOG
        run: awk -v v="## ${GITHUB_REF_NAME#v}" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md && test -s notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
